name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyyaml
      - run: python -m pytest tests/ -q
      - run: python -m py_compile api/index.py api/account.py
      - run: python -c "import json; json.load(open('vercel.json')); print('vercel.json OK')"
      - run: python -c "import html.parser; html.parser.HTMLParser().feed(open('public/index.html').read()); print('index.html parses OK')"

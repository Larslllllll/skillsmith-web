<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan result — skillsmith</title>
<meta property="og:title" content="Scan a skill — skillsmith">
<meta property="og:description" content="Run a security scan on any SKILL.md file.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://skillsmith.ch/scan.html">
<link rel="canonical" href="https://skillsmith.ch/scan.html">
<meta property="og:image" content="https://skillsmith.ch/og-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://skillsmith.ch/og-card.png">
<meta name="description" content="Public security-scan verdict with security score (0-100) and score-trend sparkline for any Claude Agent Skill (SKILL.md), by skillsmith.ch">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0d1117;--panel:#161b27;--border:#2a3142;--text:#e6edf3;--text-muted:#8b949e;--accent:#58a6ff;--green:#2ea043;--yellow:#d29922;--orange:#f0883e;--dark-orange:#db6d28;--red:#da3633;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;line-height:1.5;}
main{max-width:720px;margin:0 auto;padding:1.5rem 1rem 4rem;}
h1{font-size:1.15rem;} h1 span{color:var(--text-muted);}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin-bottom:1rem;min-width:0;}
.verdict{font-size:1.6rem;font-weight:700;margin:.2rem 0 .5rem;}
.v-clean{color:var(--green);} .v-low,.v-medium{color:var(--yellow);} .v-high,.v-critical{color:var(--red);}
dl{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1.2rem;margin:0;font-size:.85rem;}
dt{color:var(--text-muted);} dd{margin:0;word-break:break-all;min-width:0;}
.badge-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;}
pre.snippet{background:#0a0d13;border:1px solid var(--border);border-radius:6px;padding:.7rem;font-size:.75rem;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}
button{background:var(--accent);border:none;color:#04121f;font-family:inherit;font-weight:600;padding:.45rem .9rem;border-radius:6px;cursor:pointer;font-size:.8rem;}
.disclaimer{color:var(--text-muted);font-size:.75rem;}
a{color:var(--accent);}
@media (max-width:520px){dl{grid-template-columns:1fr;} dt{margin-top:.4rem;}}
</style>
<meta property="og:title" content="Scan verdict — skillsmith">
<meta property="og:description" content="Public security verdict for a Claude Agent Skill (SKILL.md).">
<meta property="og:type" content="website">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Scan a SKILL.md — skillsmith",
    "url": "https://skillsmith.ch/scan.html",
    "description": "Run a security scan on any Claude Agent Skill (SKILL.md): prompt injection detection, exfil patterns, dangerous code, dependency OSV, behavioral sandbox."
  }
  </script>
</head>
<body>
<main>
<h1>skillsmith <span>/ scan verdict</span></h1>
<div class="panel" id="result"><p class="disclaimer">Loading…</p></div>
<div class="panel" id="badgePanel" style="display:none;">
  <h2 style="font-size:.95rem;margin-top:0;">Embed this verdict</h2>
  <div class="badge-row">
    <div id="badgePreview"></div>
    <a href="#snippet">get snippet ↓</a>
  </div>
</div>
<div class="panel" id="jsonPanel" style="display:none;"><h2 style="font-size:.95rem;margin-top:0;">Raw scan result (JSON)</h2><p class="disclaimer" style="margin-top:0;font-size:0.78em;">For CI/CD, audit logs, or security dashboards.</p><button onclick="copyJson()">Copy JSON</button> <span class="disclaimer" id="copyJsonMsg"></span></div>
<div class="panel" id="snippetPanel" style="display:none;">
  <h2 style="font-size:.95rem;margin-top:0;">Markdown for your README</h2>
  <pre class="snippet" id="snippet"></pre>
  <button onclick="copySnippet()">Copy</button> <span class="disclaimer" id="copyMsg"></span>
</div>
<p class="disclaimer">Heuristic static scan — not a security guarantee. Scan your own skill at
<a href="/">skillsmith.ch</a>.</p>
</main>
<script>
const params = new URLSearchParams(location.search);
const sha = (params.get('sha256') || '').toLowerCase().trim();
function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function trendArrow(t) {
  if (!t || !t.direction) return '';
  if (t.direction === 'improved') return ' <span style="color:var(--green);" title="improved by ' + (t.delta||0) + '">↑</span>';
  if (t.direction === 'declined') return ' <span style="color:var(--red);" title="declined by ' + (t.delta||0) + '">↓</span>';
  return ' <span style="color:var(--text-muted);" title="unchanged">→</span>';
}
function sparkline(hist) {
  if (!Array.isArray(hist) || hist.length < 2) return '';
  // hist: [[ts, score], ...] -- normalize scores to 0..100, draw a 60x12 SVG
  const w = 60, h = 12, pad = 1;
  const scores = hist.map(p => Number(p[1])).filter(n => Number.isFinite(n));
  if (scores.length < 2) return '';
  const min = Math.min.apply(null, scores), max = Math.max.apply(null, scores);
  const span = max - min || 1;
  const step = (w - 2 * pad) / (scores.length - 1);
  const pts = scores.map((s, i) => (pad + i * step).toFixed(1) + ',' + (h - pad - ((s - min) / span) * (h - 2 * pad)).toFixed(1)).join(' ');
  const last = scores[scores.length - 1];
  const color = last >= 90 ? 'var(--green)' : last >= 70 ? 'var(--yellow)' : last >= 50 ? 'var(--orange)' : last >= 30 ? 'var(--dark-orange)' : 'var(--red)';
  return ' <svg width="' + w + '" height="' + h + '" style="vertical-align:middle;margin-left:.4em;" aria-label="score trend"><polyline fill="none" stroke="' + color + '" stroke-width="1.2" points="' + pts + '"/></svg>';
}
(async () => {
  const el = document.getElementById('result');
  if (!/^[0-9a-f]{64}$/.test(sha)) { el.innerHTML = '<p class="disclaimer">Invalid or missing sha256 in URL.</p>'; return; }
  try {
    const res = await fetch('/api/public_scan?sha256=' + sha);
    if (res.status === 404) { el.innerHTML = '<p class="disclaimer">This hash has never been scanned.</p>'; return; }
    if (!res.ok) throw new Error(res.status);
    const d = await res.json(); _cachedScan = d;
    const risk = d.risk_level || 'unknown';
    const when = d.last_seen_at ? new Date(d.last_seen_at * 1000).toISOString().slice(0, 10) : '?';
    el.innerHTML =
      '<p style="margin:0;color:var(--text-muted);font-size:.8rem;">' + esc(d.name || 'unnamed skill') + '</p>' +
      '<div class="verdict v-' + esc(risk) + '">' + esc(risk).toUpperCase() +
      (d.risk_score != null ? ' &middot; risk score ' + esc(d.risk_score) : '') + '</div>' +
      '<dl>' +
      '<dt>SHA-256</dt><dd><code>' + esc(sha) + '</code></dd>' +
      '<dt>Security score</dt><dd>' + (d.security_score != null ? esc(d.security_score) + ' / 100' + trendArrow(d.trend) : '—') + sparkline(d.score_history) + '</dd>' +
      '<dt>Security score</dt><dd>' + (d.security_score != null ? esc(d.security_score) + ' / 100' + trendArrow(d.trend) : '—') + sparkline(d.score_history) +
      ' <a href="#" onclick="event.preventDefault();var el=document.getElementById(\'scoreinfo\');el.style.display=el.style.display?\'\':\'none\';" style="color:#58a6ff;font-size:0.85em">(what does this mean?)</a>' +
      '</dd>' +
      '<dd id=\"scoreinfo\" style=\"display:none;margin-top:4px;padding:8px 12px;background:#161b27;border:1px solid #30363d;border-radius:6px;font-size:0.82em;color:#8b949e;\">' +
      '<strong style=\"color:#e6edf3\">Score bands</strong><br>' +
      '<span style=\"color:#2ea043\">&#9679; 90–100</span> no suspicious patterns found<br>' +
      '<span style=\"color:#d29922\">&#9679; 70–89</span> minor issues, usually safe<br>' +
      '<span style=\"color:#f0883e\">&#9679; 50–69</span> notable patterns, review before use<br>' +
      '<span style=\"color:#db6d28\">&#9679; 30–49</span> multiple red flags, use with caution<br>' +
      '<span style=\"color:#da3633\">&#9679; 0–29</span> high-risk patterns detected<br>' +
      '<strong style=\"color:#e6edf3\;margin-top:6px;display:inline-block\">Trend arrow</strong><br>' +
      '&#9650; improved since last scan &nbsp; &#9660; declined &nbsp; &#8594; unchanged &nbsp; &#8212; no history' +
      '</dd>' +
      '<dt>Lint</dt><dd>' + (d.lint_ok ? 'ok' : 'issues found') + '</dd>' +
      '<dt>Parsed</dt><dd>' + (d.parse_ok ? 'yes' : 'no') + '</dd>' +
      '<dt>Times seen</dt><dd>' + esc(d.seen_count) + '</dd>' +
      '<dt>Last scanned</dt><dd>' + esc(when) + '</dd>' +
      '</dl>';
    const badgeUrl = location.origin + '/badge?sha256=' + sha;
    document.getElementById('badgePanel').style.display = '';
    document.getElementById('badgePreview').innerHTML = '<img alt="skillsmith verdict badge" src="' + badgeUrl + '">';
    document.getElementById('snippetPanel').style.display = '';
    document.getElementById('snippet').textContent =
      '[![skill check](https://skillsmith.ch/badge?sha256=' + sha + ')](https://skillsmith.ch/scan.html?sha256=' + sha + ')';
  } catch (e) {
    el.innerHTML = '<p class="disclaimer">Lookup failed: ' + esc(e.message) + '</p>';
  }
})();
let _cachedScan = null;
function copyJson(){
  if(!_cachedScan){document.getElementById('copyJsonMsg').textContent='not loaded';return;}
  navigator.clipboard.writeText(JSON.stringify(_cachedScan, null, 2))
    .then(() => { document.getElementById('copyJsonMsg').textContent = 'copied!'; });
}
function copySnippet(){
  navigator.clipboard.writeText(document.getElementById('snippet').textContent)
    .then(() => { document.getElementById('copyMsg').textContent = 'copied!'; });
}
</script>
</body>
</html>
